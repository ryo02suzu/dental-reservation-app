<!-- 医院専用の読み込み画面。医院サイトの booking.html（予約ページ準備画面）の最終状態と同じ見た目で、
     予約ページの準備ができるまで覆う。server/clinic-splash.ts が /book/<slug> のHTMLに差し込み、
     クライアント側（booking.tsx）が準備完了時にフェードアウトして取り除く。

<style>

#clinic-splash{position:fixed;inset:0;z-index:2147483000;overflow:hidden;min-height:560px;transition:opacity .5s ease;

@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bkGlow{0%,100%{filter:drop-shadow(0 2px 5px rgba(93,140,183,.10))}50%{filter:drop-shadow(0 9px 18px rgba(93,140,183,.22))}}

@keyframes bkBloom{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.8;transform:scale(1.09)}}
@keyframes bkBreath{0%,100%{opacity:.3;transform:scale(.78)}50%{opacity:1;transform:scale(1)}}
@keyframes bkDriftA{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px)}}
@keyframes bkDriftB{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
/* 遅延は医院サイト側と同じにしておく（下のスクリプトで経過時間を合わせると、続きから動く） */
#clinic-splash .bkWaveA{animation:bkDriftA 14s ease-in-out 1s infinite}
#clinic-splash .bkWaveB{animation:bkDriftB 16s ease-in-out 1s infinite}
#clinic-splash .bkLogo{animation:bkGlow 6s ease-in-out 1.7s infinite}
#clinic-splash .bkSheen{animation:bkSheen 2.6s ease-in-out 2s infinite}
#clinic-splash .bkStar{animation:twinkle 4.5s ease-in-out 2.3s infinite}
#clinic-splash .bkBloom{position:absolute;top:38.5%;left:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.9) 0%,rgba(198,220,238,.32) 42%,rgba(255,255,255,0) 70%);animation:bkBloom 6.5s ease-in-out 1.6s infinite}
#clinic-splash .bkDot{display:block;width:7px;height:7px;border-radius:50%;animation:bkBreath 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){#clinic-splash *{animation:none!important}}

<script>
(function () {
  // 医院サイトから渡された経過時間（#izt=ミリ秒）で、アニメーションを続きの位置に合わせる
  var m = /[#&]izt=(\d+)/.exec(location.hash);
  if (!m) return;
  try { history.replaceState(history.state, "", location.pathname + location.search); } catch (e) {}
  var t = Number(m[1]);
  // 医院サイトの画面は、こちらの応答が届くまで動き続けてから止まる。その分を足す
  try { var nav = performance.getEntriesByType("navigation")[0]; if (nav && nav.responseStart > 0) t += nav.responseStart; } catch (e) {}
  var root = document.getElementById("clinic-splash");
  try {
    root.getAnimations({ subtree: true }).forEach(function (a) { a.currentTime = t; });
  } catch (e) {}
})();
</script>
